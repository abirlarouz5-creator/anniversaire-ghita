<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Joyeux Anniversaire Ghita 🎉 </title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
background:linear-gradient(135deg,#ff4e50,#1a73e8);
color:white;
text-align:center;
overflow:hidden;
}

.container{
animation:fade 2s;
}

h1{
font-size:50px;
}

@keyframes fade{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.confetti{
position:absolute;
width:8px;
height:8px;
background:white;
animation:fall linear infinite;
}

@keyframes fall{
from{transform:translateY(-100vh);}
to{transform:translateY(100vh);}
}
</style>

</head>

<body>

<div class="container">
<h1>🎉 Joyeux Anniversaire Ghita 🎉</h1>
<h2>24 ans aujourd'hui !</h2>
<h3>Une ingénieure brillante 💻✨</h3>

<p>Je te souhaite plein de réussite,<br>
de bonheur et de projets incroyables.</p>

</div>

<script>

for(let i=0;i<70;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(c);
}

</script>

</body>
</html>
